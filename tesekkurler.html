<!DOCTYPE html>
<html lang="tr">
<head>

            height: 100vh;

            text-align: center;

            border-top: 4px solid #40A835;

        h1 { color: #1A4B75; margin-bottom: 16px; font-size: 24px; }
        p { color: #475569; margin-bottom: 24px; font-size: 15px; }
        .btn {
            background-color: #1A4B75;
            color: white;
            padding: 10px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
        }
        .btn:hover { background-color: #40A835; }
    </style>
</head>
<body>

        <h1>Talebiniz Başarıyla Alındı</h1>
